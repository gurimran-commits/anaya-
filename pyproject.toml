[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anaya"
version = "0.1.0"
description = "Anaya AI Desktop Assistant"
readme = "readme.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]
speech = [
    "kokoro>=0.9.4",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "soundfile>=0.14.0",
    "torch>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
